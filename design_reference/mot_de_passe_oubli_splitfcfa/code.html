<!-- Subtle top accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<div class="text-center mb-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Mot de passe oublié ?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Entrez l'adresse e-mail associée à votre compte et nous vous enverrons un lien pour réinitialiser votre mot de passe.
                </p>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); alert('Lien de réinitialisation envoyé !');">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Adresse e-mail</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">
                            mail
                        </span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" name="email" placeholder="nom@exemple.com" required="" type="email"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-sm bg-primary text-on-primary font-label-md text-label-md py-3 px-6 rounded-xl shadow-[0_4px_14px_rgba(0,104,95,0.25)] hover:bg-surface-tint hover:-translate-y-0.5 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
<span>Envoyer le lien</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">
                        arrow_forward
                    </span>
</button>
</form>

<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">

</div>

<style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
