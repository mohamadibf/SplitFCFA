<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Dimmed Background Overlay -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_32px_rgba(0,104,95,0.2)] w-full max-w-lg overflow-hidden flex flex-col max-h-[921px]">

<h2 class="font-headline-md text-headline-md text-primary">Ajouter une dépense</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-surface-container-highest">

</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-lg overflow-y-auto flex-1 flex flex-col gap-lg">
<!-- Amount & Currency -->
<div class="flex gap-4">
<div class="flex-1">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Montant</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-headline-md text-headline-md">FCFA</span>
<input class="w-full bg-surface-container pl-20 pr-4 py-3 rounded-lg border-none focus:ring-2 focus:ring-primary text-headline-md font-headline-md text-on-surface placeholder:text-outline-variant" placeholder="0.00" type="number"/>
</div>
</div>
</div>
<!-- Description -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Description</label>
<input class="w-full bg-surface-container px-4 py-3 rounded-lg border-none focus:ring-2 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline-variant" placeholder="Ex: Dîner au restaurant..." type="text"/>
</div>
<!-- Date & Category -->
<div class="flex gap-4">
<div class="flex-1">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">calendar_today</span>
<input class="w-full bg-surface-container pl-10 pr-4 py-3 rounded-lg border-none focus:ring-2 focus:ring-primary font-body-md text-body-md text-on-surface" type="date"/>
</div>
</div>
<div class="flex-1">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Catégorie</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">category</span>
<select class="w-full bg-surface-container pl-10 pr-4 py-3 rounded-lg border-none focus:ring-2 focus:ring-primary font-body-md text-body-md text-on-surface appearance-none">
<option>Nourriture</option>
<option>Transport</option>
<option>Loisirs</option>
</select>
</div>
</div>
</div>
<!-- Payer Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Payé par</label>
<div class="flex items-center gap-3 bg-surface-container p-3 rounded-lg cursor-pointer hover:bg-surface-container-highest transition-colors">
<img class="w-10 h-10 rounded-full object-cover shadow-sm" data-alt="A small circular avatar of a young woman with curly hair, smiling softly in a bright modern office setting. The lighting is soft and flattering, maintaining a high-key light mode aesthetic. The background is a blurred off-white with subtle hints of teal." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3kzOnyRuChETgZJZSyZ5AM33q_CH9Vyr4viDJEtRRkMBsFKPhsuHbY6LUVMdDup61eTbfsLmghnOwMWmpLkcYmT-SZzm9MtCeywPNdZ5CxAjGbuT-QNRmctVat7MHjiUdOgvutnW9nkIU5pFXyK1Ax1vR5ciCELp81_GQMmGhiUgE9MPnDnz-Pvoxx3H3Uz3JjywJccdMJtpjKv1VMOfaWxleb66byVg2tpf6mOlIlbTymyyC--w"/>
<span class="font-label-md text-label-md text-on-surface flex-1">Vous</span>

<label class="block font-label-md text-label-md text-on-surface-variant mb-2">Pour qui ?</label>

<button class="flex-1 py-2 font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all text-center">Pourcentage</button>
</div>
</div>
<!-- Split Preview (Equal) -->
<div class="bg-surface-container-low border border-outline-variant/20 rounded-lg p-4">
<div class="flex justify-between items-center mb-3">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-label-sm">V</div>
