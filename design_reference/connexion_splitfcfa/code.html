<style>
        .ambient-shadow {
            box-shadow: 0 4px 20px rgba(0, 104, 95, 0.1);
        }
        .lift-on-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .lift-on-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 104, 95, 0.15);
        }

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased text-on-background">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl ambient-shadow p-lg md:p-xl flex flex-col gap-lg items-center relative overflow-hidden">
<!-- Background Decoration -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary-container"></div>
<div class="absolute -top-10 -right-10 w-3xl h-3xl bg-primary-fixed-dim opacity-20 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-3xl h-3xl bg-secondary-fixed-dim opacity-20 rounded-full blur-2xl pointer-events-none"></div>
<!-- Header / Branding -->
<header class="flex flex-col items-center gap-sm mt-sm z-10 w-full text-center">
<img alt="Logo SplitFCFA" class="w-20 h-20 object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLvtGDO3j3bli0xuuYnf_hQXUPBxCKMG_VJYwY6uttJVKDjEnMMtreZSTbfFtqrMuk4umMkE8O8FoBnTRVktfmcbHBu8zjUF2WdtjOvC4pe5PSUuvptCwPeDMIb04HQ1GGGBVN3BM_k6sQAVQkBRnLDiKdol1rKlqTSuFL7NKpzAf8WR58iAZPgsGBmi7-V904aBNN8urROQlm7vbBbw1Xvnpmv5SlYv58GvG4Ad4XcGLlugwQcYZUioPg"/>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Content de vous revoir !</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Connectez-vous pour gérer vos dépenses communes.</p>
</header>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-md z-10" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Adresse e-mail</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline z-10" data-weight="fill">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg bg-surface-container border border-transparent focus:border-primary focus:ring-2 focus:ring-primary-container/20 font-body-md text-body-md text-on-surface transition-all" id="email" name="email" placeholder="nom@exemple.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary hover:text-surface-tint transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline z-10" data-weight="fill">lock</span>
<input class="w-full pl-xl pr-xl py-sm rounded-lg bg-surface-container border border-transparent focus:border-primary focus:ring-2 focus:ring-primary-container/20 font-body-md text-body-md text-on-surface transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-lg lift-on-hover mt-sm flex justify-center items-center gap-xs" type="submit">
                Se connecter
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<footer class="w-full text-center mt-sm z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                Vous n'avez pas de compte ? 
                <a class="text-primary font-label-md hover:underline decoration-2 underline-offset-2" href="#">Inscrivez-vous</a>
</p>
</footer>
</main>
<script>
        // Simple password toggle visibility logic
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
